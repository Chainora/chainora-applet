group 'chainora-applet'  
version '1.0.0'  
  
// Buildscript configuration cho javacard-gradle plugin  
buildscript {  
    repositories {  
        mavenCentral()  
        maven { url "https://javacard.pro/maven" }  
        maven { url "https://deadcode.me/mvn" }  
    }  
    dependencies {  
        classpath 'com.klinec:gradle-javacard:1.8.0'  
    }  
}  
  
apply plugin: 'com.klinec.gradle.javacard'  
apply plugin: 'idea'  
apply plugin: 'application'  
sourceCompatibility = 1.8  
  
// Common settings  
final def rootPath = rootDir.absolutePath  
final def libs = rootPath + '/libs'  
final def libsSdk = rootPath + '/libs-sdks'  
  
// Repositories  
repositories {  
    mavenCentral()  
    maven { url "https://javacard.pro/maven" }  
    maven { url "https://deadcode.me/mvn" }  
    flatDir {  
        dirs libs  
    }  
}  
  
// Dependencies  
dependencies {  
    jcardsim 'com.klinec:jcardsim:3.0.5.11'  
    implementation 'com.klinec:jcardsim:3.0.5.11'  
    implementation files("${System.getProperty('java.home')}/../lib/tools.jar")  
      
    testImplementation 'org.testng:testng:6.1.1'  
    testImplementation 'org.slf4j:slf4j-api:2.0.17'  
    testImplementation 'org.slf4j:slf4j-log4j12:2.0.17'  
    testImplementation 'org.apache.logging.log4j:log4j-core:2.17.0'  
    testImplementation 'junit:junit:4.13.2'  
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.1.1'  
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.1.1'  
      
    testImplementation(group: 'com.klinec', name: 'javacard-tools', version: '1.0.4') {  
        exclude group: "com.klinec", module: "jcardsim"  
    }  
      
    runtimeOnly 'com.klinec:gradle-javacard:1.8.0'  
}  
  
application {  
    mainClass = 'main.Run'  
}  
  
test {  
    useJUnitPlatform {  
        excludeTags 'manual'  
    }  
}  
  
// JavaCard SDKs  
final def JC212 = libsSdk + '/jc212_kit'  
final def JC221 = libsSdk + '/jc221_kit'  
final def JC222 = libsSdk + '/jc222_kit'  
final def JC303 = libsSdk + '/jc303_kit'  
final def JC304 = libsSdk + '/jc304_kit'  
final def JC305 = libsSdk + '/jc305u1_kit'  
final def JC305u2 = libsSdk + '/jc305u2_kit'  
final def JC305u3 = libsSdk + '/jc305u3_kit'  
final def JC310b43 = libsSdk + '/jc310b43_kit'  
  
final def JC_SELECTED = JC305u3  
final def capFileName = 'applet.cap'  
final def packageAid = 'f0:56:4e:43:48:57'  
final def walletAid = 'f0:56:4e:43:48:57:01'  
final def storageAid = 'f0:56:4e:43:48:57:02'  
final def walletClass = 'applet.ChainoraWallet'  
final def storageClass = 'applet.ChainoraStorage'  
  
javacard {  
    config {  
        jckit JC_SELECTED  
        debugGpPro true  
        addImplicitJcardSim false  
        addImplicitJcardSimJunit false  
          
        cap {  
            packageName 'applet'  
            version '0.1'  
            aid packageAid  
            output capFileName  
            sources rootPath + '/applet/src/main/java/applet'  
            targetsdk JC305u3  
              
            applet {  
                className walletClass  
                aid walletAid  
            }  
              
            applet {  
                className storageClass  
                aid storageAid  
            }  
        }  
    }  
}  
  
project.afterEvaluate {  
    tasks.named('installJavaCard') {  
        enabled = false  
    }  
      
    task installJavaCardMultiple(type: DefaultTask) {  
        description = 'Install all applets from CAP file'  
        group = 'global platform'  
          
        dependsOn 'buildJavaCard', 'deleteJavaCardPackages'  
          
        doLast {  
            def capFile = "${project.buildDir.absolutePath}${File.separator}javacard${File.separator}${capFileName}"   
            project.configurations.runtimeClasspath.resolve()   
            def gpClasspath = project.configurations.runtimeClasspath.asPath   
              
            project.exec {   
                executable = 'java'   
                args = ['-cp', gpClasspath, 'pro.javacard.gp.GPTool',   
                        '--install', capFile,   
                        '--package', packageAid,   
                        '--applet', walletAid,   
                        '-d']   
            }   
              
            // Create additional applet instance without reloading CAP   
            project.exec {   
                executable = 'java'   
                args = ['-cp', gpClasspath, 'pro.javacard.gp.GPTool',   
                        '--create', storageAid,   
                        '--package', packageAid,   
                        '--applet', storageAid,   
                        '-d']   
            }   
        }  
    }  
}